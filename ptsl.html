<header><div><h1>Pengajuan PTSL — Desa Kadakajaya</h1><small>Kec. Tanjungsari, Kab. Sumedang</small></div><span style="flex:1"></span><button class="btn s" onclick="dbExp()">Ekspor DB (JSON)</button><button class="btn s" onclick="dbImp()">Impor DB (JSON)</button><span id="sbmenu"></span></header>
<div class="w">
<div id="pt"></div><div class="tabs" id="tabs"></div>

</div>

<input type="file" id="file" accept=".csv,.txt,.tsv" hidden><input type="file" id="jfile" accept=".json,application/json" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="sb-core.js"></script>
<script>
const KEY='ptsl_v2';
let S={aj:[],pd:[],dh:[],pb:[],lc:[],lm:[],pbc:{},pbfs:12};
try{const c=JSON.parse(localStorage.getItem('ptsl_pbcal')||'{}');if(c.c)S.pbc=c.c;if(c.f)S.pbfs=c.f}catch(e){}
const save=()=>{SB.push()};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fd=d=>{if(!d)return'';const[a,b,c]=d.split('-');return c?`${c}-${b}-${a}`:d};
const STATUS=['Pendaftaran','Diserahkan Ke-BPN','Dikembalikan dari BPN','Pemberkasan','Proses Verifikasi','Selesai','Diserahkan'];
const TODAY=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let DMAP=new Map();const wpOf=r=>DMAP.get(r.nop)||'-';
const SEL=new Set();let CUR=[];
const rh=r=>(r.hist||[]).map(h=>h.s+' ('+(fd(h.t)||'-')+')').join(' → ');
function histSet(r,s,t){r.hist=r.hist||[];const l=r.hist[r.hist.length-1];if(l&&l.s==s)l.t=t;else r.hist.push({s,t})}
function setSt(r,s,t){r.status=s;r.tglst=t;histSet(r,s,t)}
function chSt(id,v){const r=S.aj.find(x=>x.id==id);setSt(r,v,TODAY());save();render(1)}
function chTg(id,v){const r=S.aj.find(x=>x.id==id);r.tglst=v;histSet(r,r.status,v);save();render(1)}
function upd(){const e=$('#selc');if(e)e.textContent=SEL.size+' dipilih';const b=$('#bapp');if(b)b.disabled=!SEL.size;const c=$('#hcb');if(c)c.checked=CUR.length>0&&CUR.every(r=>SEL.has(r.id))}
function selOne(id,c){c?SEL.add(id):SEL.delete(id);upd()}
function selAll(c){CUR.forEach(r=>c?SEL.add(r.id):SEL.delete(r.id));render(1)}
function bulk(){const s=$('#bst').value,t=$('#btg').value;if(!s&&!t)return alert('Pilih status dan/atau tanggal dulu.');const rs=S.aj.filter(r=>SEL.has(r.id));if(!rs.length)return;
 if(!confirm('Ubah '+rs.length+' pengajuan'+(s?' ke status "'+s+'"':'')+(t?' dengan tanggal '+fd(t):(s?' dengan tanggal hari ini':''))+'?'))return;
 rs.forEach(r=>{if(s)setSt(r,s,t||TODAY());else{r.tglst=t;histSet(r,r.status,t)}});save();SEL.clear();render(1)}
const OUTRX=/\b(desa|des\.|ds\.|kel\.|kelurahan|kec\.|kecamatan|kab\.|kabupaten|kota)(?![a-z])/i;
function rkCalc(rows){const m=new Map();let grand=0;
 rows.forEach(r=>{const a=r.alamat||'';let k,t=null;
  if(OUTRX.test(a)&&!/kadakajaya/i.test(a))k='GUNTAI';
  else{const w=a.match(/RW\.?\s*0*(\d+)/i),p=a.match(/RT\.?\s*0*(\d+)/i);if(w){k=+w[1];t=p?+p[1]:'?'}else k='?'}
  if(!m.has(k))m.set(k,{k,label:k=='?'?'TANPA RW':String(k),total:0,kids:new Map()});const g=m.get(k);g.total++;grand++;if(t!==null)g.kids.set(t,(g.kids.get(t)||0)+1)});
 const ord=k=>k=='GUNTAI'?2:k=='?'?1:0;
 const groups=[...m.values()].sort((a,b)=>ord(a.k)-ord(b.k)||(typeof a.k=='number'?a.k-b.k:0)).map(g=>({...g,kids:[...g.kids].map(([rt,n])=>({rt,n})).sort((a,b)=>((a.rt=='?')-(b.rt=='?'))||a.rt-b.rt)}));
 return{groups,grand}}

let REKO={};function rkT(k){REKO[k]=!REKO[k];render()}
function rkRows(){return S.aj.filter(r=>(!F.st||r.status==F.st)&&dOk(r))}
function rekap(){const R=rkCalc(rkRows());
 $('#view').innerHTML=`<div class="bar"><select class="flt" onchange="F.st=this.value;render()"><option value="">Semua status</option>${STATUS.map(s=>`<option ${F.st==s?'selected':''}>${s}</option>`).join('')}</select>${dBar()}<button class="btn" onclick="rkExp()">Ekspor CSV</button><button class="btn" onclick="window.print()">Cetak</button><span class="hint">Grup = RW, baris di dalamnya = RT. Alamat yang memuat nama desa/kecamatan/kabupaten dihitung GUNTAI.</span></div>
 <div class="box"><div class="tw"><table class="rk"><thead><tr><th>RW</th><th>JUMLAH</th></tr></thead><tbody>${R.groups.map(g=>`<tr class="g1" onclick="rkT('${g.k}')"><td>${g.kids.length?(REKO[g.k]?'⊞ ':'⊟ '):''}${esc(g.label)}</td><td>${g.total}</td></tr>${REKO[g.k]?'':g.kids.map(k=>`<tr><td style="padding-left:30px">${k.rt=='?'?'Tanpa RT':k.rt}</td><td>${k.n}</td></tr>`).join('')}`).join('')}<tr class="gt"><td>Grand Total</td><td>${R.grand}</td></tr></tbody></table></div></div>`}
function rkExp(){const R=rkCalc(rkRows()),L=[['RW','RT','JUMLAH']];R.groups.forEach(g=>{L.push([g.label,'',g.total]);g.kids.forEach(k=>L.push(['',k.rt,k.n]))});L.push(['Grand Total','',R.grand]);
 dl('rekap-rt-rw-ptsl.csv',new Blob(['\ufeff'+L.map(r=>r.join(',')).join('\n')]))}
function fillPt(){if(tab=='dp'){$('#pt').innerHTML='<h2>REKAP SEMENTARA JUMLAH PENGAJUAN PERORANGAN PADA PROGRAM PTSL DESA KADAKAJAYA TAHUN 2026</h2>'+'<div>'+(F.st?'STATUS : '+esc(F.st.toUpperCase())+' &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ':'')+dLbl()+wilLbl()+'per TGL. : '+TGLCTK()+'</div>';return}
 const d=new Date(),tg=String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();
 const fx=tab=='aj'?(F.kd?'FILTER : '+esc(((KDOPT.find(o=>o[0]==F.kd)||[0,F.kd])[1]).toUpperCase())+' &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ':'')+(q?'CARI : '+esc(q.toUpperCase())+' &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ':'')+wilLbl()+'JUMLAH : '+CUR.length+' DATA &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ':tab=='pd'?wilLbl()+'JUMLAH : '+CUR.length+' DATA &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ':'';
  const pj=tab=='aj'||tab=='rk',ttl={aj:'PENGAJUAN PTSL',rk:'PENGAJUAN PTSL',pd:'DATA PENDUDUK',dh:'DHKP 2026'}[tab];
 $('#pt').innerHTML=`<h2>${ttl}<br>DESA KADAKAJAYA KEC. TANJUNGSARI KAB. SUMEDANG</h2><div>${pj?'STATUS : '+esc(F.st?F.st.toUpperCase():'SEMUA STATUS')+' &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ':''}${pj?dLbl():''}${fx}per TGL. : ${tg}</div>`}
let _pg=1,_pr=0;
window.addEventListener('beforeprint',()=>{if(_pr||document.body.classList.contains('ppb'))return;_pr=1;_pg=pg;document.body.classList.toggle('prk',tab=='rk');document.body.classList.toggle('pdup',tab=='aj'&&isDupF(F.kd));PER=1e9;pg=1;fillPt();let s=$('#pgs');if(!s){s=document.createElement('style');s.id='pgs';document.head.appendChild(s)}
 let x='';if(tab=='rk'){const n=Math.max(1,document.querySelectorAll('.rk tr').length);x='.rk{font-size:'+Math.max(7,Math.min(12,(280/n-1.4)/0.43)).toFixed(1)+'pt!important}'}
 s.textContent=(tab=='rk'?'@page{size:215mm 330mm;margin:10mm}':tab=='dp'?'@page{size:A4 portrait;margin:10mm}':'@page{size:A4 landscape;margin:10mm}')+x;render(1)});
window.addEventListener('afterprint',()=>{if(!_pr)return;_pr=0;document.body.classList.remove('prk','pdup');PER=25;pg=_pg;render(1)});

async function dl(name,data){try{if(typeof claude!='undefined'&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data});return}}}catch(e){if(e&&e.code=='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;a.click()}
function rkKey(a){a=a||'';if(OUTRX.test(a)&&!/kadakajaya/i.test(a))return{gt:1,rw:0,rt:0};const w=a.match(/RW\.?\s*0*(\d+)/i),p=a.match(/RT\.?\s*0*(\d+)/i);return{gt:0,rw:w?+w[1]:999,rt:p?+p[1]:999}}
function dpCalc(rows){const m=new Map();
 rows.forEach(r=>{let g=m.get(r.nik);if(!g){const k=rkKey(r.alamat);g={nik:r.nik,nama:r.nama,tempat:r.tempat,tgl:r.tgl,n:0,gt:k.gt,rw:k.rw,rt:k.rt};m.set(r.nik,g)}g.n++});
 return [...m.values()].sort((a,b)=>b.n-a.n||a.gt-b.gt||a.rw-b.rw||a.rt-b.rt||(a.nik<b.nik?-1:a.nik>b.nik?1:0))}
const kodeOf=r=>r.kode||(r.nop&&r.nop.length>=22?r.nop.slice(14,17)+r.nop.slice(18,22):'');
const nikM=n=>S.dpm&&n?String(n).slice(0,-6)+'******':n;
const TGLCTK=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()};
function dpRows(){return dpCalc(S.aj.filter(r=>(!F.st||r.status==F.st)&&dOk(r)&&wilOk(r)))}
function daftar(){const L=dpRows(),tot=L.reduce((s,x)=>s+x.n,0);
 $('#view').innerHTML=`<div class="bar"><select class="flt" onchange="F.st=this.value;render()"><option value="">Semua status</option>${STATUS.map(s=>`<option ${F.st==s?'selected':''}>${s}</option>`).join('')}</select>${dBar()}${wilBar()}<label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" ${S.dpm?'checked':''} onchange="S.dpm=this.checked;save();render()" style="width:auto">Samarkan NIK (6 digit terakhir)</label><button class="btn" onclick="dpExp()">Ekspor CSV</button><button class="btn p" onclick="window.print()">Cetak</button><span class="hint">${L.length} orang · ${tot} pengajuan. Urut: jumlah terbanyak, lalu RW dan RT; alamat luar desa masuk GUNTAI.</span></div>
 <div class="box"><div class="tw"><table class="dp"><thead><tr><th>NIK</th><th>NAMA LENGKAP</th><th>TEMPAT LAHIR</th><th>TANGGAL LAHIR</th><th>JUMLAH YANG DIAJUKAN</th><th>RT</th><th>RW</th></tr></thead><tbody>${L.map(x=>`<tr><td>${esc(nikM(x.nik))}</td><td>${esc(x.nama)}</td><td>${esc(x.tempat)}</td><td>${fd(x.tgl)}</td><td>${x.n}</td>${x.gt?'<td colspan="2">GUNTAI</td>':`<td>${x.rt==999?'?':x.rt}</td><td>${x.rw==999?'?':x.rw}</td>`}</tr>`).join('')}</tbody><tfoot><tr><td colspan="4"><b>JUMLAH (${L.length} orang)</b></td><td style="text-align:center"><b>${tot}</b></td><td colspan="2"></td></tr></tfoot></table></div></div>`}
function dpExp(){const e=v=>{v=String(v??'');return/^\d{15,}$/.test(v)?'="'+v+'"':'"'+v.replace(/"/g,'""')+'"'};
 const L=[['NIK','NAMA LENGKAP','TEMPAT LAHIR','TANGGAL LAHIR','JUMLAH YANG DIAJUKAN','RT','RW'],...dpRows().map(x=>[nikM(x.nik),x.nama,x.tempat,fd(x.tgl),x.n,x.gt?'GUNTAI':(x.rt==999?'?':x.rt),x.gt?'GUNTAI':(x.rw==999?'?':x.rw)])];L.push(['JUMLAH',(L.length-1)+' orang','','',L.slice(1).reduce((s,r)=>s+r[4],0),'','']);

 const rows=[];let r=[],f='',iq=false;for(let i=0;i<t.length;i++){const ch=t[i];if(iq){if(ch=='"'&&t[i+1]=='"'){f+='"';i++}else if(ch=='"')iq=false;else f+=ch}else if(ch=='"')iq=true;else if(ch==d){r.push(f);f=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=ch}
 r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}
const AL={nik:['nik'],nama:['nama','nama lengkap','wajib pajak','nama wp'],tempat:['tempat lahir','tempat'],tgl:['tanggal lahir','tgl lahir','tanggal'],alamat:['alamat','alamat objek','alamat op'],nop:['nop'],blok:['letak objek','blok'],nub:['nub'],yuridis:['yuridis'],nib:['nib']};
function nd(v){v=(v||'').trim();let m=v.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:v}
function imp(){const f=$('#file');f.value='';f.onchange=async()=>{const rows=csv(await f.files[0].text());if(rows.length<2)return alert('File kosong.');
 const hd=rows[0].map(x=>x.trim().toLowerCase()),cols=T[tab].cols,ix={};cols.forEach(c=>ix[c]=hd.findIndex(h=>AL[c].includes(h)));
 if(ix[cols[0]]<0)return alert('Kolom "'+H[cols[0]]+'" tidak ditemukan di baris header.');
 let n=0,u=0;rows.slice(1).forEach(r=>{const o={};cols.forEach(c=>{let v=ix[c]>=0?(r[ix[c]]||'').trim():'';o[c]=c=='tgl'?nd(v):v});if(!o[cols[0]])return;
  const ex=tab=='pd'?S.pd.find(x=>x.nik==o.nik):S.dh.find(x=>x.nop==o.nop);if(ex){Object.assign(ex,o);u++}else{S[tab].push({id:uid(),...o});n++}});
 save();render();alert(`Impor selesai: ${n} baru, ${u} diperbarui.`)};f.click()}
function impAj(){if(!S.pd.length)return alert('Data Penduduk masih kosong. Impor dulu di tab Data Penduduk.');
 const nik=prompt('Masukkan NIK (16 digit) penduduk yang diajukan PTSL:');if(!nik)return;const p=S.pd.find(x=>x.nik==nik.trim());if(!p)return alert('NIK tidak ditemukan di Data Penduduk.');
 const m=S.dh.filter(x=>String(x.nama).toLowerCase()==p.nama.toLowerCase());let add=0;
 (m.length?m:[{nop:''}]).forEach(d=>{if(S.aj.some(x=>x.nik==p.nik&&x.nop==d.nop))return;S.aj.push({id:uid(),nik:p.nik,nama:p.nama,tempat:p.tempat,tgl:p.tgl,alamat:p.alamat,nop:d.nop,kode:d.nop?d.nop.slice(14,17)+d.nop.slice(18,22):'',namawp:d.nama||'',status:'Diajukan'});add++});
 save();tab='aj';render();alert(add+' pengajuan ditambahkan'+(m.length?'':' (NOP tidak ditemukan di DHKP, isi manual).'))}
function exp(){const cols=T[tab].cols,cnt={};S.aj.forEach(x=>cnt[x.nik]=(cnt[x.nik]||0)+1);const e=v=>{v=String(v??'');return/^\d{15,}$/.test(v)?'="'+v+'"':'"'+v.replace(/"/g,'""')+'"'};
 const t='\ufeff'+['No',...cols.map(c=>H[c]),...(tab=='aj'?STATUS.map(s=>'Tgl '+s):[])].map(e).join(',')+'\n'+S[tab].map((r,i)=>[i+1,...cols.map(c=>c=='jumlah'?(cnt[r.nik]||''):c=='namawp'?wpOf(r):r[c]),...(tab=='aj'?STATUS.map(s=>{const x=(r.hist||[]).filter(y=>y.s==s).pop();return x?x.t:''}):[])].map(e).join(',')).join('\n');
 dl(tab+'-ptsl-kadakajaya.csv',new Blob([t]))}

 const k=kodeOf(r);
 return {letak:lt,jalan:lt,atasnama:wp=='-'?'':wp,cnama:wp=='-'?'':wp,sppt4:k.length==7?k.slice(0,3)+'.'+k.slice(3):'',rtrw:m?String(m[1]).padStart(3,'0')+'/'+String(m[2]).padStart(3,'0'):'',
  k1:1,k2:1,k3b:1,ket3b:'Surat Keterangan Riwayat Tanah',k4:1,k5:1,k6:1,pk_kantor:'',sp_kantor:'KPP Pratama Sumedang',sp_thn:'2026',sk_sisi:'Selatan'}}
function pbRec(id){let x=S.pb.find(r=>r.id==id);if(!x){const a=S.aj.find(r=>r.id==id);x={id,f:pbDef(a),ts:Date.now()};S.pb.push(x);pbSave()}return x}
const pbV=(rec,k)=>{const v=rec.f[k];return v==null?'':v};
function pbFit(txt,w,fs){const t=String(txt);let n=t.length*fs*.5;if(typeof w=='number'&&n>w)fs=Math.max(7.5,fs*w/n);return fs}
function pbSketch(rec){const v=k=>pbV(rec,k),a=S.aj.find(r=>r.id==rec.id)||{},es=esc,side=v('sk_sisi')||'Selatan';
 const nm={U:v('tu'),T:v('tt'),S:v('ts'),B:v('tb')},rd=v('sk_jalan')?'Jalan '+v('sk_jalan'):'Jalan/akses';
 const road={Utara:'U',Timur:'T',Selatan:'S',Barat:'B'}[side];
 const W=602,Hh=289,cx=W/2,cy=Hh/2+6,pw=190,ph=100;
 let s=`<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" style="position:absolute;left:95px;top:248px;font-family:Arial,sans-serif" fill="none" stroke="currentColor">`;
 const T=(x,y,t,an='middle',fs=11,b=0)=>`<text x="${x}" y="${y}" text-anchor="${an}" font-size="${fs}" ${b?'font-weight="bold"':''} fill="currentColor" stroke="none">${es(t)}</text>`;
 s+=`<rect x="${cx-pw/2}" y="${cy-ph/2}" width="${pw}" height="${ph}" stroke-width="1.6"/>`;
 s+=T(cx,cy-12,'BIDANG TANAH','middle',11,1)+T(cx,cy+3,a.nama||'','middle',11)+T(cx,cy+17,'Luas ± '+(v('luas')||'.....')+' m²','middle',11)+(v('sk_pl')?T(cx,cy+31,v('sk_pl'),'middle',10):'');
 const rx=cx-pw/2-26,lx=cx+pw/2+26;
 const sd=t=>t?(/^(tanah|jalan|jl|gang|gg|sungai|selokan|kebun|sawah|saluran|lahan)/i.test(t)?t:'Sdr. '+t):'';const lab=(c,x,y,an,t)=>road==c?T(x,y,rd,an,11,1):T(x,y,t,an,11)
 s+=lab('U',cx,cy-ph/2-34,'middle',sd(nm.U))+lab('S',cx,cy+ph/2+42,'middle',sd(nm.S));
 s+=lab('T',cx+pw/2+34,cy+4,'start',sd(nm.T))+lab('B',cx-pw/2-34,cy+4,'end',sd(nm.B));
 const ln=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="3"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="1" stroke-dasharray="8 6" transform=""/>`;
 if(road=='U')s+=`<line x1="10" y1="${cy-ph/2-16}" x2="${W-10}" y2="${cy-ph/2-16}" stroke-width="3"/>`;
 if(road=='S')s+=`<line x1="10" y1="${cy+ph/2+16}" x2="${W-10}" y2="${cy+ph/2+16}" stroke-width="3"/>`;
 if(road=='T')s+=`<line x1="${cx+pw/2+16}" y1="${cy-ph/2-10}" x2="${cx+pw/2+16}" y2="${cy+ph/2+10}" stroke-width="3"/>`;
 if(road=='B')s+=`<line x1="${cx-pw/2-16}" y1="${cy-ph/2-10}" x2="${cx-pw/2-16}" y2="${cy+ph/2+10}" stroke-width="3"/>`;
 s+=T(8,18,'Alamat: '+(v('letak')?v('letak')+', ':'')+'Desa Kadakajaya, Kec. Tanjungsari, Kab. Sumedang','start',11);
 if(v('sk_lm'))s+=T(8,Hh-14,'Patokan: '+v('sk_lm'),'start',11);
 s+=`<line x1="${W-30}" y1="46" x2="${W-30}" y2="16" stroke-width="2"/><polygon points="${W-30},10 ${W-35},20 ${W-25},20" fill="currentColor" stroke="none"/>`+T(W-30,60,'U','middle',12,1);
 return s+'</svg>'}
function pbPage(rec,p,bg){const c=S.pbc[p]||[0,0],K=3.7795,fs0=+S.pbfs||12;let h='';
 POS.filter(o=>o[0]==p).forEach(o=>{const[_,k,x,y,w,f]=o;
  if(w=='c'){if(rec.f[k])h+=`<svg class="pbck" width="14" height="14" viewBox="0 0 14 14" style="left:${x-7}px;top:${y-7}px" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,7.5 5.5,11 12,2.5"/></svg>`;return}
  const t=pbV(rec,k);if(t==='')return;const fs=pbFit(t,w,f||fs0);h+=`<span class="pbt" style="left:${x}px;top:${(y-fs*.85).toFixed(1)}px;font-size:${fs.toFixed(1)}px">${esc(t)}</span>`});
 if(p==6)h+=pbSketch(rec);
 return `<div class="pbpg">${bg?`<img class="pbbg" src="${PBBG[p-1]}" alt="">`:''}<div class="pbin" style="transform:translate(${(c[0]*K).toFixed(1)}px,${(c[1]*K).toFixed(1)}px)">${h}</div></div>`}
function pbPrev(){const e=$('#pbpv');if(!e)return;const r=pbRec(PB.id),s=PB.s;
 e.innerHTML=`<div style="width:${794*s}px;height:${1122*s}px"><div style="transform:scale(${s});transform-origin:0 0;width:794px">${pbPage(r,PB.pg,PB.bg)}</div></div>`;
 document.querySelectorAll('.pbn [data-p]').forEach(b=>b.classList.toggle('on',+b.dataset.p==PB.pg));
 const c=S.pbc[PB.pg]||[0,0];['#pbdx','#pbdy'].forEach((q,i)=>{const x=$(q);if(x&&document.activeElement!=x)x.value=c[i]})}
function pbIn(k,v){const r=pbRec(PB.id);r.f[k]=v;r.ts=Date.now();saveL();pbPrev()}
function pbCk(k,v){const r=pbRec(PB.id);r.f[k]=v?1:0;r.ts=Date.now();saveL();pbPrev()}
function pbFoc(k){if(POS.some(o=>o[0]==PB.pg&&o[1]==k))return;const o=POS.find(o=>o[1]==k);if(o){PB.pg=o[0];pbPrev()}else if(k.startsWith('sk_')){PB.pg=6;pbPrev()}}
function pbGo(p){PB.pg=p;pbPrev()}
function pbCal(i,v){const c=S.pbc[PB.pg]=S.pbc[PB.pg]||[0,0];c[i]=+v||0;pbCalSave();pbPrev()}
function pbSel(p,c){c?PB.sel.add(p):PB.sel.delete(p)}
function pbFs(v){S.pbfs=Math.max(8,Math.min(18,+v||12));pbCalSave();pbPrev()}
function pbZ(d){PB.s=Math.max(.4,Math.min(1.4,PB.s+d));pbPrev()}
function pbOpen(id){PB.id=id;PB.pg=1;pemberkasan()}
function pbBack(){PB.id=null;pbSave();pemberkasan()}
function pbReset(){if(confirm('Kembalikan isian berkas ini ke data awal (dari pengajuan & DHKP)?')){const r=pbRec(PB.id),a=S.aj.find(x=>x.id==PB.id);r.f=pbDef(a);r.ts=Date.now();pbSave();pemberkasan()}}
function pbPrint(pages){const r=pbRec(PB.id);if(!pages.length)return alert('Pilih minimal satu halaman.');pbSave();
 let e=$('#pbp');if(!e){e=document.createElement('div');e.id='pbp';document.body.appendChild(e)}
 e.innerHTML=pages.map(p=>pbPage(r,p,0)).join('');
 let s=$('#pbs');if(!s){s=document.createElement('style');s.id='pbs';document.head.appendChild(s)}
 s.textContent='@page{size:210mm 297mm;margin:0}';
 document.body.classList.add('ppb');setTimeout(()=>window.print(),60)}
window.addEventListener('afterprint',()=>{if(!document.body.classList.contains('ppb'))return;document.body.classList.remove('ppb');const e=$('#pbp');if(e)e.innerHTML='';const s=$('#pbs');if(s)s.textContent=''});
/* ===== Integrasi Letter C (data dari aplikasi Letter C, hanya-baca) ===== */
const pbNorm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim(),pbNum=n=>Number(n||0).toLocaleString('id-ID');
function pbLcList(a,q){q=pbNorm(q);const nm=new Set([pbNorm(a.nama),pbNorm(wpOf(a))]);let l=S.lc.map(c=>({c,s:nm.has(pbNorm(c.atasNama))?0:1}));
 if(q)l=l.filter(x=>pbNorm(x.c.kohir+' '+x.c.atasNama+' '+(x.c.tempatTinggal||'')).includes(q));
 l.sort((x,y)=>x.s-y.s||String(x.c.kohir).localeCompare(String(y.c.kohir),'id',{numeric:true}));return l.slice(0,150)}
function pbLcOpts(){const a=S.aj.find(r=>r.id==PB.id),r=pbRec(PB.id);return '<option value="">— pilih entri Letter C —</option>'+pbLcList(a,PB.lq||'').map(x=>`<option value="${esc(x.c.id)}" ${r.f.cid==x.c.id?'selected':''}>${x.s?'':'★ '}${esc(x.c.kohir)} — ${esc(x.c.atasNama)} (${esc(x.c.tempatTinggal||'-')})</option>`).join('')}
const pbRows=c=>[['Sawah',c.sawah],['Darat',c.darat],['Bangunan',c.bangunan]].flatMap(([j,a])=>(a||[]).map(x=>Object.assign({j},x)));
function pbLcRowOpts(){const r=pbRec(PB.id),c=S.lc.find(x=>x.id==r.f.cid);if(!c)return '<option value="">(pilih entri Letter C dahulu)</option>';return pbRows(c).map(x=>`<option value="${esc(x.id)}" ${r.f.crow==x.id?'selected':''}>${x.j} · persil ${esc(x.persil)} ${esc(x.kelasDesa||x.golKelas||'')} · ${x.luas?pbNum(x.luas):'-'} m²</option>`).join('')||'<option value="">(tidak ada baris tanah)</option>'}
function pbLcHTML(){if(!PB.id)return '';if(!S.lc.length)return '<fieldset><legend>Hubungkan Letter C</legend><p class="hint">Data Letter C belum tersedia (masih kosong, atau akun Anda tidak punya hak akses Letter C).</p></fieldset>';
 const r=pbRec(PB.id),c=S.lc.find(x=>x.id==r.f.cid);
 return `<fieldset><legend>Hubungkan Letter C</legend>${c?`<div class="notice">Terhubung: Kohir <b>${esc(c.kohir)}</b> a.n. <b>${esc(c.atasNama)}</b> <button class="btn s" onclick="pbLcUn()">Putuskan</button></div>`:''}
 <div class="pbg"><div class="f"><label>Cari kohir / nama</label><input type="text" value="${esc(PB.lq||'')}" oninput="pbLcQ(this.value)"></div>
 <div class="f"><label>Entri Letter C (★ = nama cocok dengan pemohon/WP)</label><select id="pblcs" onchange="pbLcSel(this.value)">${pbLcOpts()}</select></div>
 <div class="f"><label>Baris tanah yang diajukan</label><select id="pblcr" onchange="pbLcRow(this.value)">${pbLcRowOpts()}</select></div>
 <div class="f"><button class="btn p s" onclick="pbFillC()">Isi isian dari Letter C</button></div></div>
 <p class="hint">Mengisi nomor C, persil, luas, atas nama Buku C, riwayat tanah (hal. 4) dan kenyataan penguasaan (hal. 9) dari data Letter C beserta mutasinya. Periksa kembali hasilnya.</p></fieldset>`}
function pbLcRef(){const e=$('#pblc');if(e)e.innerHTML=pbLcHTML()}
function pbLcQ(v){PB.lq=v;const e=$('#pblcs');if(e)e.innerHTML=pbLcOpts()}
function pbLcSel(id){const r=pbRec(PB.id),c=S.lc.find(x=>x.id==id);r.f.cid=id;r.f.crow=c&&pbRows(c)[0]?pbRows(c)[0].id:'';r.ts=Date.now();saveL();pbLcRef()}
function pbLcRow(id){const r=pbRec(PB.id);r.f.crow=id;r.ts=Date.now();saveL()}
function pbLcUn(){const r=pbRec(PB.id);r.f.cid='';r.f.crow='';r.ts=Date.now();saveL();pbLcRef()}
function pbFillC(){const r=pbRec(PB.id),c=S.lc.find(x=>x.id==r.f.cid);if(!c)return alert('Pilih entri Letter C terlebih dahulu.');
 if(!confirm('Isian nomor C, persil, luas, riwayat tanah, dan kenyataan penguasaan akan diisi/ditimpa dari Letter C. Lanjutkan?'))return;
 const f=r.f,row=pbRows(c).find(x=>x.id==f.crow)||pbRows(c)[0],ms=S.lm.filter(m=>m.cId==c.id).sort((a,b)=>String(a.tanggal||'').localeCompare(String(b.tanggal||'')));
 f.cno=c.kohir||'';f.cnama=c.atasNama||'';
 if(row){f.persil=[row.persil,row.kelasDesa].filter(Boolean).join(' ');if(row.luas)f.luas=pbNum(row.luas)}
 f.r1nama=(ms[0]&&ms[0].dari)||c.atasNama||'';f.r1c=c.kohir||'';
 const last=ms.slice(-3);for(let n=2;n<=4;n++){const m=last[n-2];f['r'+n+'tgl']=m?fd(m.tanggal):'';f['r'+n+'ke']=m?(m.kepada||''):'';f['r'+n+'dasar']=m?[m.jenis,m.dasar].filter(Boolean).join(' - '):'';f['r'+n+'c']=m?(c.kohir||''):''}
 f.t3a_oleh=f.r1nama;ms.slice(0,3).forEach((m,i)=>{const n=i+1;f['b'+n+'_thn']=String(m.tanggal||'').slice(0,4);f['b'+n+'_oleh']=m.kepada||'';f['b'+n+'_cara']=m.jenis||''});
 for(let n=ms.length+1;n<=3;n++){f['b'+n+'_thn']=f['b'+n+'_oleh']=f['b'+n+'_cara']='' }
 if(ms.length&&!f.tgljb)f.tgljb=fd(ms[ms.length-1].tanggal);
 r.ts=Date.now();pbSave();pemberkasan()}

function pemberkasan(){
 if(!PB.id){
  const q=PB.q.toLowerCase(),done=new Set(S.pb.map(x=>x.id));
  const rows=S.aj.filter(r=>(!PB.st||r.status==PB.st)&&(!q||[r.nik,r.nama,r.alamat,r.nop,wpOf(r)].some(x=>String(x||'').toLowerCase().includes(q))));
  const sl=rows.slice(0,200);
  $('#view').innerHTML=`<div class="bar"><input type="search" placeholder="Cari NIK / nama / alamat / NOP…" value="${esc(PB.q)}" oninput="PB.q=this.value;clearTimeout(window._pq);window._pq=setTimeout(pemberkasan,250)"><select class="flt" onchange="PB.st=this.value;pemberkasan()"><option value="">Semua status</option>${STATUS.map(s=>`<option ${PB.st==s?'selected':''}>${s}</option>`).join('')}</select><button class="btn s" onclick="dbExp()" title="Unduh cadangan seluruh data termasuk berkas">⬇ Cadangkan data</button><span class="hint">${rows.length} pengajuan${rows.length>200?' (200 teratas ditampilkan, gunakan pencarian)':''}</span></div>
  <div class="box"><div class="tw"><table><thead><tr><th>No</th><th>Nama</th><th>NIK</th><th>Alamat</th><th>NOP</th><th>Nama WP</th><th>Status</th><th>Berkas</th><th></th></tr></thead><tbody>${sl.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)}</td><td>${esc(r.nik)}</td><td>${esc(r.alamat)}</td><td>${esc(r.nop)}</td><td>${esc(wpOf(r))}</td><td><span class="badge">${esc(r.status)}</span></td><td>${done.has(r.id)?'✔ di server '+pbTm((S.pb.find(x=>x.id==r.id)||{}).ts):'—'}</td><td><button class="btn s p" onclick="pbOpen('${r.id}')">Isi / Cetak berkas</button></td></tr>`).join('')||`<tr><td colspan="9" class="empty">Tidak ada pengajuan${PB.st?` berstatus “${esc(PB.st)}”. Ubah filter ke “Semua status”, atau ubah status pengajuan di tab Pengajuan PTSL.`:''}</td></tr>`}</tbody></table></div></div>`;return}
 const a=S.aj.find(r=>r.id==PB.id);if(!a){PB.id=null;return pemberkasan()}
 const r=pbRec(PB.id),v=k=>esc(pbV(r,k));
 const fld=(f)=>{const[k,l,t]=f;if(t=='ck')return `<label class="pbk f"><input type="checkbox" ${r.f[k]?'checked':''} onchange="pbCk('${k}',this.checked)">${esc(l)}</label>`;
  if(t=='sel')return `<div><label>${esc(l)}</label><select onchange="pbIn('${k}',this.value)">${['Utara','Timur','Selatan','Barat'].map(o=>`<option ${pbV(r,k)==o?'selected':''}>${o}</option>`).join('')}</select></div>`;
  return `<div class="${t=='f'?'f':''}"><label>${esc(l)}</label><input type="text" value="${v(k)}" onfocus="pbFoc('${k}')" oninput="pbIn('${k}',this.value)"></div>`};
 $('#view').innerHTML=`<div class="pbn"><button class="btn" onclick="pbBack()">← Daftar</button><b>${esc(a.nama)}</b><span class="hint">NIK ${esc(a.nik)} · NOP ${esc(a.nop)}</span><span style="flex:1"></span><span class="hint" id="pbst">${PB.sv?'✔ Tersimpan di server '+pbTm(PB.sv):(r.ts?'✔ Tersimpan di server '+pbTm(r.ts):'')}</span><button class="btn s" id="pbrl" style="display:none" onclick="pemberkasan()">↻ Muat ulang</button><button class="btn s p" onclick="pbSave()">💾 Simpan</button><button class="btn s" onclick="dbExp()" title="Unduh cadangan seluruh data">⬇ Cadangkan</button><button class="btn s d" onclick="pbReset()">Reset isian</button></div>
 <div class="pbn">${PBP.map(p=>`<span style="display:inline-flex;align-items:center;gap:2px"><input type="checkbox" style="width:auto" title="Ikut dicetak" ${PB.sel.has(p)?'checked':''} onchange="pbSel(${p},this.checked)"><button class="btn s" data-p="${p}" onclick="pbGo(${p})" title="${PBL[p]}">Hal ${p}</button></span>`).join('')}
 <button class="btn p s" onclick="pbPrint([PB.pg])">Cetak hal. ini</button><button class="btn p s" onclick="pbPrint(PBP.filter(p=>PB.sel.has(p)))">Cetak yang dicentang</button></div>
 <div class="pbn"><label><input type="checkbox" ${PB.bg?'checked':''} onchange="PB.bg=this.checked?1:0;pbPrev()"> Tampilkan latar formulir (hanya pratinjau, tidak ikut tercetak)</label>
 <span>Geser cetak hal. ini (mm): X <input type="number" id="pbdx" step="0.5" style="width:64px" onchange="pbCal(0,this.value)"> Y <input type="number" id="pbdy" step="0.5" style="width:64px" onchange="pbCal(1,this.value)"></span>
 <span>Ukuran huruf <input type="number" step="0.5" min="8" max="18" value="${S.pbfs}" style="width:58px" onchange="pbFs(this.value)"></span>
 <span><button class="btn s" onclick="pbZ(-.1)">−</button><button class="btn s" onclick="pbZ(.1)">+</button></span><b id="pbtt"></b></div>
 <div class="pbw"><div class="pbf"><div id="pblc">${pbLcHTML()}</div>${PBS.map(g=>`<fieldset><legend>${g.g}</legend><div class="pbg">${g.f.map(fld).join('')}</div></fieldset>`).join('')}<p class="hint">Hal. 3, 10, 11, 12 tidak punya titik isian untuk pemohon/desa (diisi Panitia BPN atau hanya tanda tangan), sehingga tidak dicetak dari sini. Tanda tangan, materai, dan nama yang sudah tercetak di kertas fisik tidak ikut dicetak.</p></div><div class="pbv" id="pbpv"></div></div>`;
 pbPrev()}

SB.start({module:'ptsl',title:'Pengajuan PTSL Desa Kadakajaya',
 collections:[
  {key:'aj',table:'pengajuan',mod:'ptsl',rt:1,get:()=>S.aj,set:a=>S.aj=a},
  {key:'pd',table:'penduduk',mod:'ptsl',get:()=>S.pd,set:a=>S.pd=a},
  {key:'dh',table:'dhkp',mod:'ptsl',get:()=>S.dh,set:a=>S.dh=a},
